syntax = "proto3";

package stats.message.user.action;

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.recommendation.message.user.action";

import "google/protobuf/timestamp.proto";

message UserActionProto {
    int32 user_id = 1;
    int32 event_id = 2;
    ActionTypeProto action_type = 3;
    google.protobuf.Timestamp timestamp = 4;
}

enum ActionTypeProto {
    ACTION_VIEW = 0;
    ACTION_REGISTER = 1;
    ACTION_LIKE = 2;
}

