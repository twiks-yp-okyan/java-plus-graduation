syntax = "proto3";

package stats.service.collector;

import "google/protobuf/empty.proto";
import "recommendation/messages/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.recommendation.controller.user.action";

service UserActionController {
    rpc CollectUserAction (message.user.action.UserActionProto)
        returns (google.protobuf.Empty);
}