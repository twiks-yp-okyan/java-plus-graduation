syntax = "proto3";

package stats.service.dashboard;

import "recommendation/messages/user_predictions_request.proto";
import "recommendation/messages/similar_events_request.proto";
import "recommendation/messages/interactions_count_request.proto";
import "recommendation/messages/recommended_event.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.controller";

service RecommendationsController {
    rpc GetRecommendationsForUser (stats.message.UserPredictionsRequestProto)
            returns (stream stats.message.RecommendedEventProto);

    rpc GetSimilarEvents (stats.message.SimilarEventsRequestProto)
            returns (stream stats.message.RecommendedEventProto);

    rpc GetInteractionsCount (stats.message.InteractionsCountRequestProto)
            returns (stream stats.message.RecommendedEventProto);
}