spring:
  application:
    name: product-service
  config:
    activate:
      on-profile: test
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:mainservicedb
    username: mainservice
    password: mainservice

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/