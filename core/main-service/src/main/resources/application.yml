spring:
  application:
    name: main-service
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/mainservicedb
    username: mainservice
    password: mainservice

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    ru.practicum.explorewithme: INFO
    ru.practicum.explorewithme.client: DEBUG