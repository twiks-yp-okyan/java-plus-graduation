grpc:
  server:
    port: 8085

spring:
  jpa:
    hibernate.ddl-auto: none
    properties.hibernate.format_sql: true
  sql.init.mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6546/analyzer
    username: db-user
    password: 12345

kafka:
  bootstrap-servers: "localhost:9092"
  auto-offset-reset: earliest
  consumers:
    user-actions:
      topic: stats.user-actions.v1
      group-id: user-actions-group
      max-poll-records: 100
      deserializer: USER_ACTION
    event-similarity:
      topic: stats.events-similarity.v1
      group-id: event-similarity-group
      max-poll-records: 50
      deserializer: EVENT_SIMILARITY

user:
  action:
    weight:
      like: 1.0
      register: 0.8
      view: 0.4

logging:
  level:
    ru.yandex.practicum.ewm.analyzer: DEBUG