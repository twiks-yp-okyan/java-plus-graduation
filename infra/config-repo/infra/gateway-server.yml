server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service-admin-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: user-service-read
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
            - Method=GET
          filters:
              - name: Retry
                args:
                  retries: 2
                  statuses:
                    - BAD_GATEWAY
                    - SERVICE_UNAVAILABLE
                    - GATEWAY_TIMEOUT
                  methods:
                    - GET
                  backoff:
                    firstBackoff: 100ms
                    maxBackoff: 500ms

        - id: request-service-read
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests

        - id: comment-service-admin
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**

        - id: comment-service-read
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**,/comments/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**,/comments/**

        - id: event-service-read
          uri: lb://event-service
          predicates:
            - Path=/admin/**,/compilations/**,/categories/**,/users/{userId}/events/**,/events/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/**,/compilations/**,/categories/**,/users/{userId}/events/**,/events/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600